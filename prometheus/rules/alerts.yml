groups:
  - name: host-alerts
    rules:
      - alert: HighCPUUsage
        expr: 100 - (avg by(instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 80
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Uso alto de CPU"
          description: "La instancia {{ $labels.instance }} tiene CPU superior al 80% durante más de 5 minutos."

      - alert: HighMemoryUsage
        expr: 100 * (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) > 85
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Uso alto de memoria RAM"
          description: "La instancia {{ $labels.instance }} tiene memoria superior al 85%."

      - alert: DiskAlmostFull
        expr: 100 * (1 - (node_filesystem_avail_bytes{fstype!~"tmpfs|overlay"} / node_filesystem_size_bytes{fstype!~"tmpfs|overlay"})) > 90
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Disco casi lleno"
          description: "El filesystem {{ $labels.mountpoint }} en {{ $labels.instance }} supera el 90% de uso."

  - name: service-alerts
    rules:
      - alert: TargetDown
        expr: up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Servicio no disponible"
          description: "El target {{ $labels.job }} en {{ $labels.instance }} no está respondiendo."

      - alert: ContainerDown
        expr: absent(container_last_seen{name!=""})
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Contenedor caído"
          description: "Un contenedor esperado no está disponible."

      - alert: MariaDBDown
        expr: up{job="mariadb"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "MariaDB no disponible"
          description: "El servicio MariaDB no está respondiendo."

      - alert: DjangoDown
        expr: up{job="django"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Django sin responder"
          description: "La aplicación Django no está disponible."

      - alert: TomcatDown
        expr: up{job="tomcat"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Tomcat sin responder"
          description: "El servicio Tomcat/JMX no está respondiendo."

      - alert: WordPressDown
        expr: probe_success{job="wordpress_http"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "WordPress sin responder"
          description: "WordPress no responde a peticiones HTTP."

      - alert: HighResponseTime
        expr: probe_duration_seconds{job="wordpress_http"} > 1
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Latencia alta en WordPress"
          description: "El tiempo de respuesta de WordPress supera 1 segundo."
